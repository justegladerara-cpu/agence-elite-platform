# Pilote complet sur la base de production, avec uniquement des données fictives.
# Lancement manuel (Actions > « Pilote en production » > Run workflow).
# Les comptes fictifs sont neutralisés à la fin, même en cas d'échec.
name: Pilote en production
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Adresse du site publié à vérifier dans un navigateur (vide : pas de vérification du site)"
        required: false
        default: "https://agence-elite-platform.justegladerara.workers.dev"
concurrency:
  group: pilote-production
  cancel-in-progress: false
jobs:
  pilote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lire la configuration publique
        run: grep -E '^VITE_SUPABASE_(URL|ANON_KEY)=' .env.production | sed 's/^VITE_//' >> "$GITHUB_ENV"
      - name: Joindre la base
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/url_base.sh
      - name: Navigateur pour la vérification du site
        if: inputs.site != ''
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Pilote
        env:
          SITE_URL: ${{ inputs.site }}
        run: SUPABASE_DB_URL="$BASE_URL" scripts/pilote_production.sh
