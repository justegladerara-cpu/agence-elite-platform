name: Express Congo checks
on:
  push:
    paths: ['sites-clients/express-congo/**', '.github/workflows/express-congo.yml']
  pull_request:
    paths: ['sites-clients/express-congo/**', '.github/workflows/express-congo.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-clients/express-congo
    env:
      APP_ENV: demo
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sites-clients/express-congo/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: express-congo-verification
          path: |
            sites-clients/express-congo/playwright-report
            sites-clients/express-congo/docs/screenshots

  # Publication automatique sur Cloudflare après des vérifications vertes, sur main uniquement.
  # Active seulement si le secret CLOUDFLARE_API_TOKEN existe (sinon l'étape est sautée) :
  # utile si le dépôt n'est pas relié à Cloudflare par le tableau de bord (Workers Builds).
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: sites-clients/express-congo
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Jeton Cloudflare présent ?
        id: jeton
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.jeton.outputs.present == 'true'
      - uses: actions/setup-node@v5
        if: steps.jeton.outputs.present == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sites-clients/express-congo/package-lock.json
      - run: npm ci --ignore-scripts
        if: steps.jeton.outputs.present == 'true'
      - run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
        if: steps.jeton.outputs.present == 'true'
      - name: Publication sautée
        if: steps.jeton.outputs.present != 'true'
        run: echo "Aucun secret CLOUDFLARE_API_TOKEN : publication laissée à Cloudflare Workers Builds (README)."
