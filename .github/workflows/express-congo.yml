name: Express Congo checks
on:
  push:
    paths: ['sites-clients/express-congo/**', '.github/workflows/express-congo.yml']
  pull_request:
    paths: ['sites-clients/express-congo/**', '.github/workflows/express-congo.yml']
permissions:
  contents: read
jobs:
  # Tests du code (types, lint, tests métier) : conditionnent la publication.
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-clients/express-congo
    env:
      APP_ENV: demo
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sites-clients/express-congo/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check

  # Parcours navigateur : rapport et captures, sans bloquer la publication.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-clients/express-congo
    env:
      APP_ENV: demo
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sites-clients/express-congo/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: express-congo-verification
          path: |
            sites-clients/express-congo/playwright-report
            sites-clients/express-congo/docs/screenshots

  # Publication automatique sur Cloudflare après des vérifications vertes, sur main uniquement.
  # Active seulement si le secret CLOUDFLARE_API_TOKEN existe (sinon l'étape est sautée) :
  # utile si le dépôt n'est pas relié à Cloudflare par le tableau de bord (Workers Builds).
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Secret de dépôt (Settings → Secrets → Actions) : pas d'environnement protégé, donc pas d'attente d'approbation.
    defaults:
      run:
        working-directory: sites-clients/express-congo
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # Le code d'abord : les étapes suivantes travaillent dans sites-clients/express-congo.
      - uses: actions/checkout@v5
      - name: Jeton Cloudflare présent ?
        id: jeton
        working-directory: .
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.jeton.outputs.present == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sites-clients/express-congo/package-lock.json
      # Installation complète : la construction Cloudflare a besoin des binaires installés par les paquets.
      - run: npm ci
        if: steps.jeton.outputs.present == 'true'
      - run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
        if: steps.jeton.outputs.present == 'true'
      - name: Publication sautée
        if: steps.jeton.outputs.present != 'true'
        working-directory: .
        run: echo "Aucun secret CLOUDFLARE_API_TOKEN dans le dépôt : publication sautée."
